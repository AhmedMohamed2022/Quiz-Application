<div class="row justify-content-center" @fadeAnimation>
    <div class="col-md-8">
        <div class="card shadow-lg">
            <div class="card-body text-center">
                <h1 class="display-4 mb-4">{{title}}</h1>
                <p class="lead mb-4">Test your Angular knowledge with this interactive quiz!</p>
                <div class="home-features mb-5">
                    <div class="feature">
                        <i class="bi bi-clock-history"></i>
                        <p>15-second timer for each question</p>
                    </div>
                    <div class="feature">
                        <i class="bi bi-award"></i>
                        <p>Score based on correct answers</p>
                    </div>
                    <div class="feature">
                        <i class="bi bi-trophy"></i>
                        <p>Compete on the leaderboard</p>
                    </div>
                </div>
                <div class="d-grid gap-3 col-lg-6 mx-auto">
                    <button (click)="startQuiz($event)" class="btn btn-primary btn-lg start-btn">
                        <i class="bi bi-play-fill me-2"></i>Start Quiz
                    </button>


                    <a routerLink="/leaderboard" class="btn btn-outline-secondary">
                        <i class="bi bi-list-ol me-2"></i>View Leaderboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
