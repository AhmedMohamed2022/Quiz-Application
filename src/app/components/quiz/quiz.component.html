<div class="quiz-container" @fadeAnimation>
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Quiz Progress</h5>
      <span class="badge bg-light text-dark">Question {{questionIndex}}/{{totalQuestions}}</span>
    </div>

    <div class="card-body">
      <!-- Timer Progress Bar -->
      <div class="progress mb-4" style="height: 10px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" [ngClass]="getProgressBarClass()"
          [style.width.%]="progress">
        </div>
      </div>

      <div class="timer-display mb-4 text-center">
        <span [ngClass]="{'text-danger': timeLeft <= 5}">Time Left: {{timeLeft | number:'1.0-0'}}s</span>
      </div>

      <div *ngIf="currentQuestion" @slideInAnimation>
        <h2 class="question-text mb-4">{{currentQuestion.text}}</h2>

        <div class="options-container">
          <div *ngFor="let option of currentQuestion.options; let i = index" class="option"
            [ngClass]="getOptionClass(i)" (click)="selectAnswer(i)">
            <span class="option-letter">{{['A', 'B', 'C', 'D'][i]}}</span>
            <span class="option-text">{{option}}</span>
          </div>
        </div>

        <div *ngIf="answerSubmitted" class="feedback-message text-center mt-4" [@fadeAnimation]>
          <div *ngIf="isCorrect" class="text-success">
            <i class="bi bi-check-circle-fill me-2"></i>Correct!
          </div>
          <div *ngIf="!isCorrect" class="text-danger">
            <i class="bi bi-x-circle-fill me-2"></i>Incorrect!
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
